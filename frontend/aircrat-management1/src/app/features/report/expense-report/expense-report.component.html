<div class="report-container">
  <div class="header-card expense-gradient">
    <div class="icon-box"><i class="fas fa-file-invoice-dollar"></i></div>
    <div class="info-box">
      <span class="label">Total Expenses</span>
      <h1 class="value">${{ totalExpense | number:'1.2-2' }}</h1>
    </div>
  </div>

  <div class="filter-bar">
    <select [(ngModel)]="selectedPeriod" (change)="loadData()" class="filter-select">
      <option value="daily">Today</option>
      <option value="weekly">This Week</option>
      <option value="monthly">This Month</option>
      <option value="6months">Last 6 Months</option>
    </select>
  </div>

  <div class="chart-card">
    <div class="card-header"><h3>Expense Trend</h3></div>
    <div class="chart-wrapper">
      <canvas baseChart 
        [data]="chartData" 
        [type]="chartType" 
        [options]="chartOptions">
      </canvas>
    </div>
    <p *ngIf="noDataMessage" style="text-align:center; color:#94a3b8; margin:12px 0 0;">{{ noDataMessage }}</p>
  </div>

  <div class="chart-card">
    <div class="card-header"><h3>Category Wise Expenses</h3></div>
    <div class="table-responsive">
      <table class="modern-table">
        <thead>
          <tr>
            <th>Category</th>
            <th>Share</th>
            <th style="text-align:right;">Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of categoryRows">
            <td><strong>{{ row.name }}</strong></td>
            <td>
              <span class="class-tag">{{ row.share }}%</span>
            </td>
            <td style="text-align:right;"><strong class="price">{{ formatMoney(row.amount) }}</strong></td>
          </tr>
          <tr *ngIf="categoryRows.length === 0">
            <td colspan="3" style="text-align:center; color:#94a3b8; padding:20px;">No expense records found for selected period.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
