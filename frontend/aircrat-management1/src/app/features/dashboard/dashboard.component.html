<main class="dashboard-shell">
  <section class="dashboard-shell-header">
    <div class="hero-copy">
      <span class="dashboard-eyebrow">Skyward Command Center</span>
      <h1>Skyward Analytics Center</h1>
      <p>Real-time airline operations, revenue, booking, and flight intelligence.</p>
    </div>
    <div class="hero-visual" aria-hidden="true">
      <span class="route-dot dot-a"></span>
      <span class="route-line"></span>
      <i class="fas fa-plane"></i>
      <span class="route-dot dot-b"></span>
    </div>
    <div class="hero-pills" aria-label="Analytics capabilities">
      <span *ngFor="let pill of heroPills">
        <i [class]="pill.icon"></i>
        {{ pill.label }}
      </span>
    </div>
  </section>

  <nav class="dashboard-tabs" aria-label="Dashboard sections">
    <a
      *ngFor="let tab of tabs"
      [routerLink]="tab.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }">
      <i [class]="tab.icon"></i>
      <span>{{ tab.label }}</span>
    </a>
  </nav>

  <section class="dashboard-child-surface">
    <router-outlet></router-outlet>
  </section>
</main>
